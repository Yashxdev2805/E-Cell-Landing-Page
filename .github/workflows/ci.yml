name: E-Cell CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run TypeScript & Production Bundle Build
        working-directory: ./client
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: ./client
        run: |
          test -d dist || { echo "dist directory missing!"; exit 1; }
          echo "Production build verified successfully."

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecell-landing-page-dist
          path: client/dist/
          retention-days: 14
