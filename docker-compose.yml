services:
  # ── 1. Unified Express Backend ──
  hub-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecell-hub-server
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost,http://localhost:8080,https://ecell.uietkuk.ac.in
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1)}).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ecell-mesh

  # ── 2. Hub Portal Frontend ──
  hub-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecell-hub-client
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ecell-mesh

  # ── 3. Hardened Ingress Gateway (Nginx) ──
  ingress-gateway:
    image: nginx:alpine
    container_name: ecell-ingress-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      hub-server:
        condition: service_healthy
      hub-client:
        condition: service_healthy
    networks:
      - ecell-mesh

networks:
  ecell-mesh:
    driver: bridge
