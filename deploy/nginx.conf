user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Performance Tuning & Buffer Protection
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 32M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # In-Memory Micro-Cache Zone for Read-Heavy Endpoints
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60s use_temp_path=off;

    # Upstream Definitions with Keepalive Pools
    upstream hub_server_upstream {
        server hub-server:5000;
        keepalive 32;
    }

    upstream pitch_arena_upstream {
        server pitch-arena:80;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost ecell.uietkuk.ac.in;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── 1. Root Application (Hub Portal) ──
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache Static Assets Aggressively
            location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpe?g|gif|svg|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }

        # ── 2. Pitch Arena Spoke Subpath (/arena) ──
        location /arena/ {
            proxy_pass http://pitch_arena_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── 3. Express API Gateway (/api/*) with SSE & WebSocket Support ──
        location /api/ {
            proxy_pass http://hub_server_upstream;
            proxy_http_version 1.1;
            
            # WebSocket & SSE Streaming Upgrades
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Real Client IP Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts & Buffering
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;

            # Edge Micro-Caching for Stats & Events
            location /api/portal/stats {
                proxy_pass http://hub_server_upstream;
                proxy_cache api_cache;
                proxy_cache_valid 200 30s;
                proxy_cache_bypass ;
                proxy_no_cache ;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                add_header X-Proxy-Cache $upstream_cache_status;
            }
        }

        # ── 4. Healthcheck Endpoint ──
        location /health {
            access_log off;
            return 200 "{\"status\":\"INGRESS_HEALTHY\",\"timestamp\":\"$time_iso8601\"}";
            add_header Content-Type application/json;
        }
    }
}
